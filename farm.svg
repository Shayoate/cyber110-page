<!--
READING THIS PICTURE
SVG means Scalable Vector Graphics: an image described by shapes instead of a fixed grid
of colored dots. This lets the illustration stay clear when resized. SVG uses XML,
Extensible Markup Language, whose tags and attributes look much like HTML.
Comments use the same angle-bracket comment form as HTML and are not drawn.
The svg element is the picture canvas. xmlns identifies the SVG language.
width and height give its natural size; viewBox defines the internal drawing coordinates.
A coordinate is a position: x runs left to right and y runs top to bottom.
A tag describes a shape; its attributes specify such things as position and color.
fill colors a shape interior, and stroke draws its outline. A # color is hexadecimal,
a compact way to specify red, green, and blue. opacity controls transparency.
A g element groups shapes so they can be moved or styled together.
A path describes a shape using drawing commands: M moves the pen, L draws a straight line,
H and V draw horizontal and vertical lines, C draws a curve, Q draws another curve type,
T continues that curve style, and Z closes the shape. Lowercase commands move relative
to the current position rather than naming an absolute position.
circle draws a circle; ellipse draws an oval. cx and cy locate their centers,
r gives a circle radius, and rx and ry set an oval horizontal and vertical radii.
--><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645"><!--
REUSABLE BUILDING BLOCKS: defs stores patterns, effects, and grouped drawings without
showing them immediately. An id names a definition so another element can refer to it.
--><defs>
<!--
GRASS TEXTURE: a pattern repeats a small drawing to cover a larger surface.
patternUnits="userSpaceOnUse" sizes it in the canvas coordinate units.
The short paths and dot make scattered blades and flecks without writing each one by hand.
--><pattern id="grass" width="72" height="65" patternUnits="userSpaceOnUse"><path d="m14 24-2-5m2 5 3-4m37 31-1-5m1 5 4-3" stroke="#9bb976" stroke-width="2" fill="none" opacity=".45"/><circle cx="42" cy="13" r="1.5" fill="#e6edbf"/></pattern>
<!--
SOFT SHADOW: a filter changes the appearance of a drawing. feDropShadow adds
a shadow with an offset, controlled by dx and dy, and blur, controlled by stdDeviation.
flood-color and flood-opacity set the shadow color and transparency.
Extra filter bounds leave room for the shadow so it is not cut off at the edges.
--><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="1" dy="6" stdDeviation="1" flood-color="#638343" flood-opacity=".2"/></filter>
<!--
APPLE TREE: group a ground shadow, trunk, branches, leafy outline, highlights, and fruit.
This definition is reused around the meadow so the same tree can appear at several sizes.
--><g id="tree"><ellipse cy="55" rx="42" ry="13" fill="#819c5c" opacity=".2"/><path d="M-5 7h10v45h-10z" fill="#9d8150"/><path d="m1 23-17-16m17 9L17 0" fill="none" stroke="#9d8150" stroke-width="5"/><path d="M-44-4C-52-27-32-46-15-43-9-68 29-65 34-42 61-38 63-8 46 3 48 28 19 35 0 23-23 39-51 19-44-4" fill="#83a45b"/><path d="M-36-21c-5-19 16-25 27-22 5-20 28-18 36-3 25 1 26 26 15 34C17-19-7-8-36-21" fill="#9bb775"/><circle cx="-22" cy="-12" r="5" fill="#ce8460"/><circle cx="24" cy="3" r="5" fill="#d99067"/><circle cx="12" cy="-35" r="4" fill="#dd9970"/></g>
<!--
PINE TREE: the narrow trunk and stepped triangular paths form an evergreen tree.
Different greens make the left and right portions look softly shaded.
--><g id="pine"><ellipse cy="50" rx="30" ry="9" fill="#72904f" opacity=".18"/><path d="M-4 14h8v35h-8z" fill="#998257"/><path d="m0-67-30 48h12l-23 36h17l-21 27h89L24 17h17L18-19h12z" fill="#6f9258"/><path d="m0-67-30 48H0z" fill="#85a465"/><path d="M0-32-24 40H1z" fill="#7d9e61"/></g>
<!--
FLOWERING BUSH: an oval ground shadow and a green curved path make a small shrub.
The tiny yellow circles add flowers to the foliage.
--><g id="bush"><ellipse cy="10" rx="33" ry="9" fill="#779c54" opacity=".18"/><path d="M-33 0c-4-18 14-27 23-19 4-22 31-19 33-2C45-19 47 5 32 9h-56z" fill="#91b568"/><circle cx="-9" cy="-8" r="2" fill="#f8e9a6"/><circle cx="20" cy="-4" r="2" fill="#f8e9a6"/></g>
<!--
FENCE SECTION: vertical paths make the posts and horizontal paths make the rails.
stroke-width controls line thickness. Several copies will form longer stretches of fence.
--><g id="fence"><path d="M0 0v39M40 0v39M80 0v39M120 0v39M160 0v39" stroke="#baab79" stroke-width="9"/><path d="M-3 9h166M-3 27h166" stroke="#e6dcad" stroke-width="7"/><path d="M0-4 0 0M40-4v4M80-4v4M120-4v4M160-4v4" stroke="#e6dcad" stroke-width="9"/></g>
<!--
MEADOW LAYERS: the reusable definitions end here, and the visible scene starts.
First paint the base grass rectangle, then curved distant color bands.
url(#grass) refers to the named grass pattern and fills a whole-canvas path with it.
--></defs><path fill="#d3e2ad" d="M0 0h1000v645H0z"/><path d="M-40 140Q185 38 360 108T760 78 1050 110V-10H-40z" fill="#c4d89d"/><path d="M-20 515q200-120 410-36t330 9 310-40v240H-20z" fill="#cbdda4"/><path fill="url(#grass)" d="M0 0h1000v645H0z"/>
<!--
WINDING FARM PATH: draw two thick curved lines, the darker wide one first
and the lighter narrow one on top, to create a soft-edged walkway toward the barn.
--><path d="M-30 390q154-11 248-54t120-129q47-79 122-104" fill="none" stroke="#dfe0b1" stroke-width="53"/><path d="M-30 390q154-11 248-54t120-129q47-79 122-104" fill="none" stroke="#e9e5bf" stroke-width="39"/>
<!--
SIDE PATH: this shorter curve branches from the main walkway toward the lower meadow.
--><path d="M220 395q-13 107 44 160" fill="none" stroke="#e9e5bf" stroke-width="30"/>
<!--
DISTANT FENCE: use makes a copy of a named definition; href="#fence" selects it.
A transform changes a drawing position or shape: translate moves it, rotate tilts it,
and scale changes its size. These copies form a slightly angled fence behind the patches.
--><g opacity=".8"><use href="#fence" transform="translate(350 139) rotate(-5)"/><use href="#fence" transform="translate(525 124) rotate(-5)"/><use href="#fence" transform="translate(700 109) rotate(-5)"/></g>
<!--
UPPER-LEFT PLANTS: reuse pines, an apple tree, and a bush to frame the barn area.
--><use href="#pine" transform="translate(31 102) scale(1.3)"/><use href="#pine" transform="translate(84 92)"/><use href="#tree" transform="translate(171 111) scale(1.08)"/><use href="#bush" transform="translate(234 152)"/>
<!--
LITTLE RED BARN: apply the shared shadow effect, move the whole group, and tilt it.
Layer wall shapes, thin siding lines, roof pieces, doorway, cross braces, and a window
so a detailed building is assembled from a handful of simple paths.
--><g filter="url(#shadow)" transform="translate(55 192) rotate(-5)"><path fill="#bb7560" d="M12 26 94-31l90 67v132H12z"/><path fill="#d18a71" d="M12 58h172v110H12z"/><path d="M31 59v109M52 59v109M74 59v109M97 59v109M121 59v109M147 59v109M167 59v109" stroke="#bd7965" stroke-width="2"/><path d="M-3 35 94-40l104 78-13 15-91-68-83 66z" fill="#6b7760"/><path d="m3 37 91-69 96 72" fill="none" stroke="#7f896b" stroke-width="7"/><path d="M61 91h67v77H61z" fill="#8c6751" stroke="#f1dcb3" stroke-width="5"/><path d="M94 94v74m-30-72 62 70m0-70-62 70" stroke="#ead3a9" stroke-width="4"/><path d="M75 29h40v30H75z" fill="#665e45" stroke="#f1dcb3" stroke-width="4"/><path d="M95 31v26m-18-13h36" stroke="#f1dcb3" stroke-width="3"/><path d="M23 169h152" stroke="#b0a072" stroke-width="6"/></g>
<!--
BARN SHRUBS: place two copies of the bush around the base of the barn.
--><use href="#bush" transform="translate(63 377)"/><use href="#bush" transform="translate(116 388) scale(.7)"/>
<!--
UPPER-RIGHT ORCHARD: use scaled copies to frame the right side of the scene.
--><use href="#tree" transform="translate(905 181) scale(1.25)"/><use href="#tree" transform="translate(800 164) scale(.85)"/><use href="#pine" transform="translate(984 147) scale(1.25)"/>
<!--
ORCHARD SHRUB: fill the space beneath the right-hand trees with another small bush.
--><use href="#bush" transform="translate(870 252)"/>
<!--
DUCK POND: layered curved paths make the grassy rim and blue water.
Lighter lines suggest ripples, and small cream shapes make the duck body and head.
A gold path is its beak, a tiny circle is its eye, and the last strokes draw reeds.
stroke-linecap="round" rounds the ends of lines for a softer hand-drawn appearance.
--><g transform="translate(830 406) rotate(-12)"><path d="M-69-34C-19-73 35-61 68-24 104 18 52 66-1 60-45 76-114 35-98-2Z" fill="#b9ce94"/><path d="M-66-28C-20-61 33-50 60-19 90 17 49 56-1 49-43 64-103 31-88 0Z" fill="#87bac0"/><path d="M-59-20c35-27 81-22 105 3" fill="none" stroke="#a5d0cf" stroke-width="4" stroke-linecap="round"/><path d="M-47 32h23m27 5h18m18-23h18" stroke="#acd0c9" stroke-width="3" stroke-linecap="round"/><ellipse cx="-13" cy="7" rx="15" ry="8" fill="#fff4d2"/><circle cx="-2" cy="-4" r="7" fill="#fff4d2"/><path d="m3-5 8 3-7 2" fill="#d5a052"/><circle cx="0" cy="-6" r="1" fill="#5e6554"/><path d="M65 46v-27m0 19 7-15m-10 16-7-9" stroke="#809958" stroke-width="4" stroke-linecap="round"/></g>
<!--
LOWER-RIGHT BORDER: put a smaller tilted fence and bush beside the pond.
--><use href="#fence" transform="translate(756 502) rotate(-7) scale(.95)"/><use href="#bush" transform="translate(968 494)"/>
<!--
FOREGROUND PLANTS: larger trees and shrubs frame the bottom corners.
SVG draws later elements over earlier ones, which supplies the scene layering.
--><use href="#tree" transform="translate(62 548) scale(1.25)"/><use href="#bush" transform="translate(126 592)"/><use href="#pine" transform="translate(968 607) scale(1.35)"/><use href="#pine" transform="translate(900 625) scale(.8)"/>
<!--
MEADOW FLOWERS: repeated short green stems and small colored circles sprinkle flowers
around the farm. Each following stem-and-circle pair adds one flower without changing gameplay.
--><path d="m281 165v-8" stroke="#90a45e" stroke-width="2"/><circle cx="281" cy="157" r="3" fill="#f5e7a1"/><path d="m290 170v-8" stroke="#90a45e" stroke-width="2"/><circle cx="290" cy="162" r="3" fill="#f7edbe"/><path d="m274 174v-8" stroke="#90a45e" stroke-width="2"/><circle cx="274" cy="166" r="3" fill="#f5e7a1"/><path d="m714 204v-8" stroke="#90a45e" stroke-width="2"/><circle cx="714" cy="196" r="3" fill="#e0bba3"/><path d="m723 209v-8" stroke="#90a45e" stroke-width="2"/><circle cx="723" cy="201" r="3" fill="#f7edbe"/><path d="m707 213v-8" stroke="#90a45e" stroke-width="2"/><circle cx="707" cy="205" r="3" fill="#f7edbe"/><path d="m762 330v-8" stroke="#90a45e" stroke-width="2"/><circle cx="762" cy="322" r="3" fill="#e0bba3"/><path d="m771 335v-8" stroke="#90a45e" stroke-width="2"/><circle cx="771" cy="327" r="3" fill="#f7edbe"/><path d="m755 339v-8" stroke="#90a45e" stroke-width="2"/><circle cx="755" cy="331" r="3" fill="#f5e7a1"/><path d="m292 473v-8" stroke="#90a45e" stroke-width="2"/><circle cx="292" cy="465" r="3" fill="#e0bba3"/><path d="m301 478v-8" stroke="#90a45e" stroke-width="2"/><circle cx="301" cy="470" r="3" fill="#f7edbe"/><path d="m285 482v-8" stroke="#90a45e" stroke-width="2"/><circle cx="285" cy="474" r="3" fill="#e0bba3"/><path d="m722 555v-8" stroke="#90a45e" stroke-width="2"/><circle cx="722" cy="547" r="3" fill="#f7edbe"/><path d="m731 560v-8" stroke="#90a45e" stroke-width="2"/><circle cx="731" cy="552" r="3" fill="#f7edbe"/><path d="m715 564v-8" stroke="#90a45e" stroke-width="2"/><circle cx="715" cy="556" r="3" fill="#f7edbe"/><path d="m171 495v-8" stroke="#90a45e" stroke-width="2"/><circle cx="171" cy="487" r="3" fill="#f5e7a1"/><path d="m180 500v-8" stroke="#90a45e" stroke-width="2"/><circle cx="180" cy="492" r="3" fill="#f5e7a1"/><path d="m164 504v-8" stroke="#90a45e" stroke-width="2"/><circle cx="164" cy="496" r="3" fill="#f7edbe"/><path d="m928 323v-8" stroke="#90a45e" stroke-width="2"/><circle cx="928" cy="315" r="3" fill="#f7edbe"/><path d="m937 328v-8" stroke="#90a45e" stroke-width="2"/><circle cx="937" cy="320" r="3" fill="#f7edbe"/><path d="m921 332v-8" stroke="#90a45e" stroke-width="2"/><circle cx="921" cy="324" r="3" fill="#e0bba3"/><path d="m400 566v-8" stroke="#90a45e" stroke-width="2"/><circle cx="400" cy="558" r="3" fill="#f5e7a1"/><path d="m409 571v-8" stroke="#90a45e" stroke-width="2"/><circle cx="409" cy="563" r="3" fill="#f7edbe"/><path d="m393 575v-8" stroke="#90a45e" stroke-width="2"/><circle cx="393" cy="567" r="3" fill="#e0bba3"/><path d="m602 95v-8" stroke="#90a45e" stroke-width="2"/><circle cx="602" cy="87" r="3" fill="#f7edbe"/><path d="m611 100v-8" stroke="#90a45e" stroke-width="2"/><circle cx="611" cy="92" r="3" fill="#f7edbe"/><path d="m595 104v-8" stroke="#90a45e" stroke-width="2"/><circle cx="595" cy="96" r="3" fill="#e0bba3"/><path d="m511 522v-8" stroke="#90a45e" stroke-width="2"/><circle cx="511" cy="514" r="3" fill="#e0bba3"/><path d="m520 527v-8" stroke="#90a45e" stroke-width="2"/><circle cx="520" cy="519" r="3" fill="#e0bba3"/><path d="m504 531v-8" stroke="#90a45e" stroke-width="2"/><circle cx="504" cy="523" r="3" fill="#f7edbe"/><!--
DISTANT BIRDS: the final small angled paths suggest flying birds above the meadow.
--><path d="m700 62 7-5 7 5m20-8 6-4 6 4" stroke="#8d9c72" stroke-width="2" fill="none" stroke-linecap="round"/></svg>